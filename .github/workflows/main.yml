name: Deploy Web to GitHub Pages

on:
  push:
    branches: [ main ] # Или master, в зависимости от вашей ветки
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Соответствует вашему engines
          cache: 'npm'
          # Кеширование npm в корне и в web папке
          cache-dependency-path: |
            package-lock.json

      - name: Install Core Dependencies
        run: npm ci

      - name: Build Core (Library)
        # Собираем корневой пакет, чтобы dist/ появился
        run: npm run build

      - name: Install Web Dependencies
        working-directory: ./
        # Используем ci, если есть package-lock.json, иначе install
        run: npm ci

      - name: Build Web
        working-directory: ./
        # Скрипт build:core внутри web сделает cd .. и npm run build, 
        # но мы уже собрали корень выше, так что это может быть избыточно,
        # но не повредит. Основное — это tsc --noEmit && vite build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
